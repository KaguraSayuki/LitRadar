# LitRadar 研究方向与检索偏好示例
# 复制为 interests.yaml，按自己的方向调整示例，并替换尖括号中的占位内容。
# 请检查期刊、排除词与种子是否适用。
# 真实 interests.yaml 不进入版本库。
#
# 本文件采用单方向格式，对应固定的 default 组。
# 多方向配置使用顶层 groups: 列表，每组包含下方的画像字段，并可设置：
#   slug：稳定标识；name：显示名称；enabled：是否参加默认流水线；
#   llm_rank：是否进行本组 LLM 精排。
# 从旧配置转换时保留原组的 slug: default，以继续使用已有成员、分数和反馈。
# groups: 不能与顶层的单方向画像字段混写。
#
# 完整分组示例和网页添加步骤见 docs/subscription-groups.md。
# 规则与 BM25 在本地计算；精排及方向性摘要可能按组产生模型调用费用。
# 关闭 llm_rank 只停止精排，摘要仍由全局 LLM 设置控制。

# 研究方向描述，用于精排和方向性摘要。请将关键内容放在前 300 个字符内。
direction: >
  关注有机合成方法学与过渡金属催化，重点研究金属卡宾参与的 N–H 插入反应，
  以及相关串联反应的区域选择性和对映选择性。

# Crossref 和 OpenAlex 的英文检索式，多条查询取并集。
# 以下是有机合成方向的示例，使用前请按研究范围调整。
search_queries:
  - '"N-H insertion" diazo aniline asymmetric'
  - '"aza-Claisen" rearrangement tandem carbene'

# Semantic Scholar 布尔查询：+ 为与，| 为或，双引号表示短语，- 表示排除。
# 与 search_queries 分开配置；例如："N-H insertion" + diazo + aniline。
s2_queries:
  - '"N-H insertion" + diazo + aniline'
  - '"aza-Claisen" + carbene'

# 关键词偏好，core 和 bonus 参与规则与关键词排序。
keywords:
  core:
  - metal carbene
  - N-H insertion
  bonus:
  - enantioselective
  - copper catalysis
  # 当前研究难点，为 LLM 判断相关性提供背景。
  current_challenges:
  - <当前研究难点>
  # 希望优先关注的主题。
  boost_topics:
  - <优先关注的主题>

# 按标题前缀排除非论文记录或更正声明，避免对标题全文作过宽匹配。
exclude_title_prefixes:
  - "review for"
  - "author response for"
  - "decision letter for"
  - "corrigendum"
  - "correction to"
  - "author correction"
  - "erratum"
  - "frontispiece"
  - "addendum"
  - "editorial"
  - "retraction"

# 通用排除词，按子串匹配；请检查是否会误排本方向需要的文献。
# 命中后在本组标记规则排除，条目仍保留在数据库中。
negative:
  - "supplementary material"
  - "polymerization"
  - "polymer electrolyte"
  - "lithium battery"
  - "electrocatalysis"
  - "water splitting"
  - "CO2 reduction"
  - "metal-organic framework"
  - "covalent organic framework"
  - "photovoltaic"
  - "drug delivery"
  - "formulation"
  - "clinical trial"
  - "biomarker discovery"

