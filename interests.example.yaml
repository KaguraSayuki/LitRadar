# ============================================================================
# LitRadar 检索词与偏好 —— 示例模板
# ----------------------------------------------------------------------------
# 用法: cp interests.example.yaml interests.yaml 然后按自己的方向改。
# 真实的 interests.yaml 已在 .gitignore 中排除,不会进版本库。
#
# 下面每个字段都会被代码实际读取;用不到的可以留空列表。
# ============================================================================

# 研究方向(中文可读,会拼进 LLM 精排与摘要的 prompt)
direction: >
  <在这里写你的研究方向。中文可读即可,它会拼进 LLM 精排与摘要的 prompt。> 示例:有机合成方法学 / 过渡金属催化。以 XX 为底物,经 XX 催化构建 XX 中间体,

# ── 检索词(必须英文,多条取并集) ─────────────────────────────────────────
# 实测(45 天窗口、按 DOI 去重):单条宽查询 100 篇 → 4 条并集 186 篇(+86%)。
# 收益在【召回】不在精确率 —— 拆开后单条精确率反而略降。精确交给 LLM 精排。
search_queries:
  - "<英文检索词,多条取并集>"
  - 'example: "N-H insertion" diazo aniline asymmetric'
  - 'example: "aza-Claisen" rearrangement tandem carbene'

# ── Semantic Scholar bulk 检索词 ──────────────────────────────────────────────
# ⚠️ 这个端点**必须用查询语法**,裸词会被当短语匹配而返回 0 条:
#       "N-H insertion" + diazo + aniline      -> 命中 3
#       diazo carbene N-H insertion aniline    -> 命中 0   ← 直接抄上面那行会失败
#   语法:+ = AND,| = OR,双引号 = 短语,- = 排除。
#
# 为什么值得单独配:Crossref 是模糊匹配(召回高、噪声大),bulk 是精确 AND
# (召回低、准确率高)。两条腿互补,用 DOI 合并。实测 ("para-selective" |
# "para-allylation") + aniline 命中 14,含 "Asymmetric para-Functionalization
# of Anilines Via Chiral Phosphoric..."。
s2_queries:
  - '"<英文短语>" + <词> + <词>'
  - '("<说法A>" | "<说法B>") + <词>'
  # + 是 AND,| 是 OR,双引号是短语

# ── 关键词(规则打分用) ────────────────────────────────────────────────────
keywords:
  core:
  - <核心关键词,命中即高分>
  - metal carbene
  - N-H insertion
  bonus:
  - <加分关键词>
  - enantioselective
  - copper catalysis
  current_challenges:
  - <你当前实验卡在哪 —— 能对症的论文会被 LLM 显著加权>
  boost_topics:
  - <希望优先命中的主题>

# ── 非论文记录:按标题【前缀】排除 ──────────────────────────────────────────
# Crossref 会登记同行评审与更正声明。用前缀而非子串,避免误伤正当标题。
exclude_title_prefixes:
  - "review for"
  - "author response for"
  - "decision letter for"
  - "corrigendum"
  - "correction to"
  - "author correction"
  - "erratum"
  - "frontispiece"
  - "addendum"
  - "editorial"
  - "retraction"

# ── 排除方向(子串匹配,命中直接丢弃,省 LLM 额度) ─────────────────────────
# ⚠️ 只放【通用领域词】。不要从单篇论文标题抄词组 —— 那是过拟合,会误杀相关论文。
negative:
  - "supplementary material"
  - "polymerization"
  - "polymer electrolyte"
  - "lithium battery"
  - "electrocatalysis"
  - "water splitting"
  - "CO2 reduction"
  - "metal-organic framework"
  - "covalent organic framework"
  - "photovoltaic"
  - "drug delivery"
  - "formulation"
  - "clinical trial"
  - "biomarker discovery"

