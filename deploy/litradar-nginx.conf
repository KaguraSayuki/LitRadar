# litradar.conf — nginx 前置：LitRadar 退到 127.0.0.1:8090，对外走 3090（HTTPS 自签）
#
# 安装：
#   sudo cp deploy/litradar-nginx.conf /etc/nginx/conf.d/litradar.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 与 dsh.conf 的关系：两者互不干扰，各占一个对外端口
#   DSH      → 对外 3080 → 127.0.0.1:3081
#   LitRadar → 对外 3090 → 127.0.0.1:8090
#
# 复用 dsh 的自签证书（SAN 已含局域网 IP / localhost）。若该证书不存在，
# 见本文件末尾的 openssl 命令自行生成。

# 不记录查询字符串和 Referer，避免初始化链接或旧 URL 口令进入日志。
log_format litradar_private '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen      3090 ssl;
    listen      [::]:3090 ssl;
    server_name _;

    # 复用现有自签证书。若报找不到文件，改用末尾命令另生成一份。
    ssl_certificate     /etc/nginx/ssl/dsh.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:LITRADARSSL:5m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/litradar-access.log litradar_private;
    # 邮件上传每次最多 20 封、每封 5 MB，另留 multipart 表单开销。
    client_max_body_size 105m;

    # 安全响应头。写在 server 块，location 里不要再写 add_header——
    # nginx 的 add_header 不是叠加而是整组覆盖，location 一写这里的就全丢了。
    #   Referrer-Policy 由应用返回；初始化代码跳转需 no-referrer，表单页需 same-origin。
    #   X-Content-Type-Options  别让浏览器把响应嗅探成别的类型执行。
    #   X-Frame-Options   页面只允许自己嵌自己，防点击劫持。
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-Frame-Options        "SAMEORIGIN"  always;

    proxy_http_version 1.1;

    # 保留原始 Host（含端口），否则应用生成的绝对链接会带上内部地址。
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 应用在受信任 HTTPS 转发头下设置 Secure；代理再次保证所有访问凭据的标志。
    # 需要 nginx >= 1.19.3。
    proxy_cookie_flags litradar_k Secure httponly samesite=lax;
    proxy_cookie_flags litradar_session Secure httponly samesite=strict;
    proxy_cookie_flags litradar_setup Secure httponly samesite=strict;

    # 手动触发流水线（/admin/run/*）要跑几分钟，别让 nginx 先超时断开。
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}

# ---------------------------------------------------------------------------
# 如果没有可复用的证书，用下面命令自签一份（把 <你的局域网IP> 换成实际地址）：
#
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/litradar.key \
#     -out    /etc/nginx/ssl/litradar.crt \
#     -subj "/CN=litradar" \
#     -addext "subjectAltName=IP:<你的局域网IP>,IP:127.0.0.1,DNS:localhost"
#   sudo chmod 600 /etc/nginx/ssl/litradar.key
#
# 然后把上面的 ssl_certificate 两行改成 litradar.crt / litradar.key。
#
# 自签证书应先在客户端核对并信任，再访问实例。
# ---------------------------------------------------------------------------
