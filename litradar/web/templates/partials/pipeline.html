<section class="pipeline-progress" data-pipeline aria-label="流水线运行进度">
  <div class="pipeline-progress__head"><strong data-run-title>等待运行</strong><span data-run-elapsed></span></div>
  <p data-run-message role="status">选择一个阶段，或按顺序运行完整流水线。</p>
  <div class="pipeline-progress__meter" data-run-meter hidden><progress data-run-bar aria-label="当前步骤处理进度"></progress><span data-run-count></span></div>
  <ol class="pipeline-progress__steps" data-run-steps hidden></ol>
  <p class="pipeline-progress__error" data-run-error role="alert" hidden></p>
  <p class="pipeline-progress__note">排序和摘要可能产生 AI 费用。任务启动后可离开或刷新页面，再回来查看进度。</p>
</section>
