# LitRadar 运行配置示例
# 可选的部署参考，普通用户在网页保存后自动创建 config.yaml。
# 密钥通过网页接入；兼容配置旁的 .env，不写入此文件。
# 使用说明：README.md；部署说明：docs/deployment.md。

# 应用与路径。相对路径基于项目根目录解析。
app:
  # litradar serve 默认采用此值，显式 --host/--port 优先。
  # 直接运行 Uvicorn 时由其参数决定；局域网使用 HTTPS 代理与访问密码。
  host: "127.0.0.1"
  port: 8090
  db_path: "./data/litradar.db"
  timezone: "Asia/Shanghai"
  # 接口口令的凭据名称。非回环地址既无口令也无访问密码时，网页拒绝手动运行。
  token_env: "LITRADAR_TOKEN"
  # 密码哈希的凭据名称，由首次设置网页或 litradar admin-password 设置。
  admin_password_env: "LITRADAR_ADMIN_PASSWORD_HASH"
  # 研究方向、检索式及订阅组配置文件。
  interests: "./interests.yaml"

  # 排序与摘要默认处理的时间窗，CLI、定时任务和网页按钮共用。
  # 建议不小于 sources.s2_search_lookback_days，避免新采集条目落在排序范围外。
  pipeline_window_days: 200

# 网页手动运行的密码检查；频率检查统一用于网页、CLI 和应用调度。
# 这是运行次数限制，不是货币预算；测试连接和预览不计入流水线次数。
# 多组分别计数；邮件与元数据补全的全局记录计入每个组。
admin:
  # 登录会话可授权；仅使用接口口令时需额外验证密码。
  guarded_stages: [rank, summarize, all]
  # 同一阶段的最小运行间隔，单位为秒；0 表示关闭此项检查。
  cooldown_seconds: 60
  # 同一阶段的每日运行次数上限；0 表示关闭此项检查。
  daily_limit: 3

# 每日计划由网页修改。部署代理先停用旧定时任务，再运行
# litradar schedule-handoff --external-timers-stopped 记录接管，不能只改 enabled。
schedule:
  enabled: false
  time: "07:00"
  groups: []  # 留空表示所有启用的方向
  owner: external
  handoff_confirmed: false

# LLM 精排与摘要。各组的 llm_rank 只控制精排，摘要使用全局开关。
llm:
  # 兼容 OpenAI Chat Completions；默认提供 DeepSeek 预设，也可在网页填写其他服务。
  provider: openai-compatible
  base_url: "https://api.deepseek.com"
  # 调用的模型名称，费用及可用性以服务提供方为准。
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_KEY"  # 保留旧变量名；自定义服务同样使用此凭据槽位。
  json_mode: auto  # auto / json_object / prompt
  token_limit_parameter: auto  # auto / max_tokens / max_completion_tokens
  # null 表示不发送 temperature，使用模型默认值。
  temperature: 0.2
  # 每批参与 LLM 精排的条目数。
  rerank_batch_size: 20
  # 0 表示不在 BM25 后截断候选；大于 0 时按粗排限制候选范围。
  rerank_top_k: 0
  # 每组排名前 N 的候选生成深度摘要；其余生成简要摘要。
  deep_summary_top_n: 8
  timeout: 120
  enabled: true

# 邮件接入。当前 IMAP 支持密码或授权码登录，未实现 OAuth2。
# 请使用邮箱服务商提供的服务器地址和凭据；连接会校验证书与主机名。
mail:
  # folder：本地 .eml；maildir：标准 Maildir；imap：远程邮箱。
  mode: "folder"
  folder: "./data/inbox"
  # folder 模式处理成功后的归档目录。
  move_processed_to: "./data/inbox/processed"

  imap_host: "imap.qq.com"
  imap_port: 993
  # IMAP 账号，通常为接收订阅邮件的邮箱地址。
  imap_user: ""
  # 密码或授权码的凭据名称，实际值通过网页接入，也兼容 .env。
  imap_password_env: "IMAP_PASSWORD"
  imap_folder: "INBOX"
  imap_search: 'FROM "newsletter.x-mol.com"'
  # true：只采集未读邮件，成功入库后标为已读。
  # false：只读访问，每轮读取匹配邮件后按 Message-ID 去重。
  imap_mark_seen: true

# 数据源开关及请求范围。元数据补全与检索分别配置。
sources:
  # 关闭后跳过邮件采集和历史原文重放；不影响显式诊断命令。
  xmol_enabled: true

  # Crossref 元数据补全，用于期刊、ISSN、作者等信息。
  crossref_enabled: true
  # 可选关键词检索，使用 interests.yaml 的 search_queries。
  crossref_search_enabled: false
  crossref_lookback_days: 14
  crossref_rows: 100

  # Semantic Scholar 按 DOI 补全摘要等信息，可尝试匿名请求。
  s2_enabled: true
  # 流水线中 Semantic Scholar 请求的最小间隔，单位为秒。
  # 各端点共享调用间隔；请求仍可能触发限流，请按获批额度调整。
  s2_min_interval: 5.0
  # 布尔检索使用 s2_queries；本项目要求配置 S2_API_KEY。
  s2_search_enabled: true
  # 可显式指定年份范围，如 2024-2026；为空时由回溯天数推算。
  s2_search_year: ""
  # 获取结果后还会按具体日期做本地过滤。
  s2_search_lookback_days: 180
  s2_search_max_pages: 1
  s2_venues: []  # 指定期刊条件所用的限定列表，留空不限定

  # 追踪引用 seed_dois 中种子文献的论文，需要 S2_API_KEY。
  snowball_enabled: true
  # 每组最多使用的种子数。
  snowball_max_seeds: 25
  # 每轮每组刷新的种子数，优先选择较久未查询的种子。
  snowball_seeds_per_run: 5
  # 候选论文至少引用的不同种子数；1 表示命中任一种子即可。
  snowball_min_cocitations: 1
  # 每个种子最多获取的被引记录数。
  snowball_per_seed: 100

  # 可选 OpenAlex 检索；启用时需配置下面指定的环境变量。
  openalex_enabled: false
  openalex_api_key_env: "OPENALEX_API_KEY"
  openalex_per_query: 60
  openalex_lookback_days: 14

  # 请求中提供的联系邮箱，可供 Crossref 等服务识别调用方。
  mailto: ""

# 默认侧重 LLM 的相关性判断；关键词与规则提供辅助分数。
ranking:
  weights:
    llm: 0.85
    coarse: 0.10
    rule: 0.05
  # 当前粗排实现使用 BM25。
  coarse_method: "bm25"

# 可选期刊等级展示，密钥通过网页 easyScholar 卡片接入。
# 查询按归一化刊名缓存；明确无结果也缓存，接口错误保留重试机会。
journal_rank:
  enabled: true
  api_key_env: "EASYSCHOLAR_SECRET_KEY"
  # 单次元数据补全最多查询的新刊数。
  max_lookups: 40

  # 卡片展示的字段。删除字段可隐藏该项。
  fields: [sciwarn, sci, sciUp, sciif, pku, cssci]

  # 来源刊名到查询刊名的别名，用于查询和缓存复用。
  aliases:
    "Youji huaxue": "Chinese Journal of Organic Chemistry"
    "Angewandte Chemie": "Angewandte Chemie International Edition"

  # 普通键重命名字段标签；/正则/ 键转换值，$1 引用捕获组。
  # 空标签仍显示值；如需隐藏整项，请从 fields 删除。
  map:
    北大中文核心: 北核
    SCI: ""
    SCIIF: "IF"
    SCIIF(5): ""
    CSCD: ""
    EI检索: EI
    SCI升级版: ""
    SCIWARN: ""
    "/生物学(\\d+)区/": "生$1"
    "/农林科学(\\d+)区/": "农$1"
    "/环境科学与生态学(\\d+)区/": "环$1"
    "/工程技术(\\d+)区/": "工$1"
    "/地球科学(\\d+)区/": "地$1"
    "/计算机科学(\\d+)区/": "计$1"
    "/人文科学(\\d+)区/": "人$1"
    "/综合性期刊(\\d+)区/": "综$1"
    "/社会学(\\d+)区/": "社$1"
    "/材料科学(\\d+)区/": "材$1"
    "/医学(\\d+)区/": "医$1"
    "/教育学(\\d+)区/": "教育$1"
    "/化学(\\d+)区/": "化$1"
    "/物理与天体物理(\\d+)区/": "物$1"
